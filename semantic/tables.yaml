# Governed table catalog for analytics_poc (V0.1).
# Single source of truth: sql/create_raw_tables.sql, sql/create_typed_views.sql and
# sql/validate_data.sql are GENERATED from this file by scripts/generate_sql.py.
#
# Column fields
#   src     exact CSV header text (order matters: OpenCSVSerde maps by position)
#   name    snake_case column name (default: derived from src)
#   type    string | int | bigint | amount | rate | date | timestamp | bool   (default: string)
#   pii     none | identifier | quasi | sensitive | direct                   (default: table default_pii or none)
#             identifier       -> kept in typed view (needed as key), never exposed to the LLM layer
#             quasi/sensitive/direct -> EXCLUDED from typed views and validation output
#   quality placeholder | all_zero | constant   data-quality finding from profiling; do not
#             use such columns in metrics or as dimensions until real data replaces them
#   note    confirmed meaning/format from profiling
#   review  open question that must be resolved before the column is used in metrics
#
# Types were confirmed by aggregate profiling (scripts/profile_s3.py, 2026-10-18):
# all dates are ISO yyyy-mm-dd, all typed columns convert with 0 failures, 0 malformed rows.
# The dataset is synthetic/demo data (DEMO-* branches, "Demo <Column>" placeholders).
# No relationships between tables are declared or assumed.

aws:
  profile: analytics-poc                      # dev/admin scripts (DDL, discovery)
  runtime_profile: analytics-query-runtime    # bi_service query execution (read-only IAM user)
  region: ap-south-1
  account_id: "791896160716"
  source_bucket: opta-s3-demo
  source_prefix: nbfc-base-data/
  results_bucket: analytics-poc-athena-results-791896160716-ap-south-1
  workgroup: analytics_poc_wg
  database: analytics_poc
  bytes_scanned_cutoff: 1073741824   # 1 GiB per query

# Milestone 4 (approved 2026-10-19): Nova Micro via APAC cross-region profile; demo/mock data only.
bedrock:
  enabled: true
  region: ap-south-1
  model_id: apac.amazon.nova-micro-v1:0
  model_label: Amazon Nova Micro
  timeout_seconds: 10
  max_tokens: 400
  temperature: 0
  # list-price estimate (USD per 1K tokens) for cost reporting only; confirm against the bill
  price_per_1k_input: 0.000035
  price_per_1k_output: 0.00014
  guardrail_id: ch7aqg7t3js4  # analytics-poc-guardrail (infrastructure/config/guardrail.json), created 2026-10-19
  guardrail_version: "1"      # published version (immutable); DRAFT was used for benchmark runs 1-2

defaults:
  date_formats: ["%Y-%m-%d"]   # profiling: 100% of date values in all files match yyyy-mm-dd
  true_values: ["Y", "YES", "TRUE", "T", "1"]
  false_values: ["N", "NO", "FALSE", "F", "0"]

